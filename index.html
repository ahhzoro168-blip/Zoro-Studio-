    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Syne:wght@800&family=JetBrains+Mono:wght@400;500&family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <!-- Seamless Vite HMR stub for AI Studio dev environment -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var OrigWS = window.WebSocket;
        if (!OrigWS) return;

        class FakeViteWebSocket extends EventTarget {
          constructor(url, protocols) {
            super();
            this.url = url;
            this.protocols = protocols;
            this.readyState = 1;
            this.OPEN = 1;
            this.CONNECTING = 0;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.bufferedAmount = 0;
            this.extensions = '';
            this.protocol = typeof protocols === 'string' ? protocols : (protocols && protocols[0]) || '';
            this.binaryType = 'blob';
            this.onopen = null;
            this.onmessage = null;
            this.onerror = null;
            this.onclose = null;
          }
          send() {}
          close() {
            this.readyState = 3;
          }
        }

        function MockWebSocket(url, protocols) {
          var isVite = (typeof protocols === 'string' && protocols.startsWith('vite-')) ||
                       (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.startsWith('vite-'); })) ||
                       (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/')));
          if (isVite) {
            return new FakeViteWebSocket(url, protocols);
          }
          return new OrigWS(url, protocols);
        }
        MockWebSocket.prototype = OrigWS.prototype;
        MockWebSocket.CONNECTING = 0;
        MockWebSocket.OPEN = 1;
        MockWebSocket.CLOSING = 2;
        MockWebSocket.CLOSED = 3;
        window.WebSocket = MockWebSocket;

        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('closed without opened'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? String(event.reason.message || event.reason) : '';
          if (reason.includes('WebSocket') || reason.includes('closed without opened')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-rose-500/30 selection:text-rose-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
