<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.4" stroke-dasharray="12 12" />
  <!-- Center badge -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="#1e293b" fill-opacity="0.85" stroke="url(#accent)" stroke-width="3" />
  <!-- Chinese character: 译 (Translate) or 华 (Hua) -->
  <text x="180" y="240" font-family="'Noto Sans SC', sans-serif, system-ui" font-weight="900" font-size="96" fill="#38bdf8" text-anchor="middle" filter="url(#glow)">中</text>
  <!-- Arrow exchange -->
  <path d="M220 256 L292 256 M276 240 L296 256 L276 272" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Khmer character: ខ្មែរ / ក -->
  <text x="330" y="240" font-family="'Kantumruy Pro', 'Khmer OS', sans-serif, system-ui" font-weight="800" font-size="80" fill="#f43f5e" text-anchor="middle" filter="url(#glow)">ខ្មែរ</text>
  <!-- Subtitle -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="4">LINGUAKHMER</text>
  <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AI TRANSLATION STUDIO</text>
</svg>
